# Every push to main builds the desktop app for Windows, macOS and Linux and publishes it
# as the "latest" GitHub Release. The app checks that release and shows "Update available".
name: desktop-app
on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/live-check.yml", "scripts/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      APP_VERSION: v1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python build_desktop.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item dist/TrenchScope.exe "TrenchScope-$env:APP_VERSION.exe"
          Compress-Archive -Path "dist/TrenchScope-$env:APP_VERSION.exe" -DestinationPath "TrenchScope-$env:APP_VERSION-Windows.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mv dist/TrenchScope.app "dist/TrenchScope-$APP_VERSION.app"
          ditto -c -k --keepParent "dist/TrenchScope-$APP_VERSION.app" "TrenchScope-$APP_VERSION-macOS.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/TrenchScope "dist/TrenchScope-$APP_VERSION"
          tar -czf "TrenchScope-$APP_VERSION-Linux.tar.gz" -C dist "TrenchScope-$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: TrenchScope-*

  release:
    needs: build
    # publish whatever built: GitHub's macOS runners are sometimes unavailable, which shouldn't block Windows / Linux
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Need at least one build
        run: ls out/TrenchScope-* >/dev/null
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Trench Scope v1.${{ github.run_number }}
          make_latest: "true"
          files: out/*
          body: |
            **Download for your computer, unzip, double-click.** Your browser opens the dashboard.
            - Windows: `TrenchScope-v1.${{ github.run_number }}-Windows.zip` → `TrenchScope-v1.${{ github.run_number }}.exe` (if SmartScreen warns: More info → Run anyway)
            - macOS: `…-macOS.zip` → the `.app` (first time: right-click → Open)
            - Linux: `…-Linux.tar.gz`
            Opening a new version automatically closes an older one that is still running.
            Your keys and data live in your user folder, so installing a new version keeps them.
