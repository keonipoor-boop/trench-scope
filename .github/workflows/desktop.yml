# Every push to main builds the desktop app for Windows, macOS and Linux and publishes it
# as the "latest" GitHub Release. The app checks that release and shows "Update available".
name: desktop-app
on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/live-check.yml", "scripts/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        edition: [main, friends]   # Friends Edition = same app, its own name / data folder / port
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      APP_VERSION: v1.${{ github.run_number }}
      EDITION: ${{ matrix.edition }}
      FILE: ${{ matrix.edition == 'friends' && 'TrenchScope-Friends' || 'TrenchScope' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python build_desktop.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item "dist/$env:FILE.exe" "$env:FILE-$env:APP_VERSION.exe"
          Compress-Archive -Path "dist/$env:FILE-$env:APP_VERSION.exe" -DestinationPath "$env:FILE-$env:APP_VERSION-Windows.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mv "dist/$FILE.app" "dist/$FILE-$APP_VERSION.app"
          ditto -c -k --keepParent "dist/$FILE-$APP_VERSION.app" "$FILE-$APP_VERSION-macOS.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mv "dist/$FILE" "dist/$FILE-$APP_VERSION"
          tar -czf "$FILE-$APP_VERSION-Linux.tar.gz" -C dist "$FILE-$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}-${{ matrix.edition }}
          path: ${{ env.FILE }}-v*

  release:
    needs: build
    # publish whatever built: GitHub's macOS runners are sometimes unavailable, which shouldn't block Windows / Linux
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Need at least one build
        run: ls out/TrenchScope-* >/dev/null
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Trench Scope v1.${{ github.run_number }}
          make_latest: "true"
          files: out/*
          body: |
            **Download for your computer, unzip, double-click.** Your browser opens the dashboard.
            - Windows: `TrenchScope-v1.${{ github.run_number }}-Windows.zip` → `TrenchScope-v1.${{ github.run_number }}.exe` (if SmartScreen warns: More info → Run anyway)
            - macOS: `…-macOS.zip` → the `.app` (first time: right-click → Open)
            - Linux: `…-Linux.tar.gz`
            Opening a new version automatically closes an older one that is still running.
            **Friends Edition** (`TrenchScope-Friends-…` files): the same app with its own data folder and port, for sharing.
            It never sees your keys, KOLs or history, and it updates with every release like the main app.
            Your keys and data live in your user folder, so installing a new version keeps them.
