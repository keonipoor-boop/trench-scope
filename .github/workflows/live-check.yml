# Manual live diagnostic: Actions -> live-check -> Run workflow. Runs a real scan against
# pump.fun / DexScreener / GeckoTerminal and reports whether the given tickers were found.
name: live-check
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Tickers to look up (space separated)"
        default: "PENNY"
      days:
        description: "Lookback days"
        default: "2"
      probe:
        description: "Also probe candidate endpoints"
        default: "no"
      debug:
        description: "Only run the fee debugger on the symbols"
        default: "no"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - if: ${{ inputs.probe == 'yes' }}
        run: pip install websockets && python scripts/probe.py
      - if: ${{ inputs.debug == 'yes' }}
        run: python scripts/fee_debug.py ${{ inputs.symbols }}
      - if: ${{ inputs.debug != 'yes' }}
        run: python run.py doctor || true
      - if: ${{ inputs.debug != 'yes' }}
        run: python scripts/live_check.py ${{ inputs.symbols }}
        env:
          DAYS: ${{ inputs.days }}
